name: KerniQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Test managed action runtime foundations
        run: |
          pnpm --filter @qodex/action-runtime test
          pnpm --filter @qodex/python-runtime test
          pnpm --filter @qodex/agentfuse-adapter test

      - name: Check whitespace
        run: git diff --check

  dsh-governed-spike:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check isolated DSH spike sources
        run: npm --prefix packages/dsh-engine-adapter run build

      - name: Run fail-closed DSH admission tests
        run: npm --prefix packages/dsh-engine-adapter test

      - name: Verify spike stays outside the product workspace
        run: |
          grep -F '!packages/dsh-engine-adapter' pnpm-workspace.yaml
          if grep -R --line-number --fixed-strings '@qodex/dsh-engine-adapter-spike' apps packages/*/package.json 2>/dev/null | grep -v 'packages/dsh-engine-adapter/package.json'; then
            echo 'DSH spike unexpectedly entered the product dependency graph' >&2
            exit 1
          fi

  python-bridge:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create controlled bridge test environment
        run: |
          python -m venv .ci-python
          .ci-python/bin/python -m pip install pytest==8.3.5

      - name: Fetch and verify canonical AgentFuse source
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output /tmp/dhms-engine.tar.gz \
            https://codeload.github.com/MkaliezZ/dhms-engine/tar.gz/ec4b5842339dccfba0db62df7541920759203bc9
          echo "1659d81d39aab382d550c33c3b6a42b24254f584055eb15d8168f17200e323c3  /tmp/dhms-engine.tar.gz" \
            | sha256sum --check
          mkdir .ci-agentfuse
          tar -xzf /tmp/dhms-engine.tar.gz --strip-components=1 -C .ci-agentfuse

      - name: Test canonical Python bridge
        env:
          KERNIQ_AGENTFUSE_SOURCE: ${{ github.workspace }}/.ci-agentfuse
        run: |
          .ci-python/bin/python -m pytest python/kerniq_agentfuse_bridge/tests
          .ci-python/bin/python -m compileall -q python/kerniq_agentfuse_bridge

  desktop-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop runtime dependencies
        run: |
          pnpm --filter @qodex/action-runtime build
          pnpm --filter @qodex/agentfuse-adapter build
          pnpm --filter @qodex/session-runtime build

      - name: Install Playwright Chromium
        run: pnpm --filter @qodex/desktop exec playwright install --with-deps chromium

      - name: Run deterministic desktop E2E
        run: pnpm --filter @qodex/desktop test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playwright-failure
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  native-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Check Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --check

      - name: Check native desktop
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: Test native desktop
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
